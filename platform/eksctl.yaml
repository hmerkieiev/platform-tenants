# EKS puts a control-plane interface in two zones, so the VPC lists two.
# Nodes stay in one zone, and one NAT serves them. The /16 is this stand's range.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: platform-tenants
  region: eu-north-1

vpc:
  cidr: 10.200.0.0/16
  nat:
    gateway: Single

availabilityZones:
  - eu-north-1a
  - eu-north-1b

managedNodeGroups:
  - name: nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    availabilityZones:
      - eu-north-1a
    privateNetworking: true

addons:
  - name: vpc-cni
    # Redis has no password. Policy is the wall, so the CNI has to enforce it.
    configurationValues: |-
      enableNetworkPolicy: "true"
  - name: coredns
  - name: kube-proxy
