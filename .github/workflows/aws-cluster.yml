name: aws-cluster

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_REGION: eu-north-1
      CLUSTER: platform-tenants
      TF_IN_AUTOMATION: "1"
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask the account
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: bash .github/scripts/mask-account.sh

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          role-duration-seconds: 14400

      - name: Install tools
        run: |
          curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/1.14.3/terraform_1.14.3_linux_amd64.zip"
          sudo unzip -o terraform.zip -d /usr/local/bin
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Apply the cluster
        run: |
          terraform -chdir=terraform/cluster init -input=false
          terraform -chdir=terraform/cluster apply -input=false -auto-approve -var install_platform=false
          terraform -chdir=terraform/cluster apply -input=false -auto-approve -var install_platform=true
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}" >/dev/null

      - name: Tenants
        run: bash scripts/aws-demo

      - name: Destroy the cluster
        if: always()
        run: |
          terraform -chdir=terraform/cluster init -input=false
          terraform -chdir=terraform/cluster destroy -input=false -auto-approve
