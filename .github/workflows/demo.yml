name: demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - run: python3 scripts/platform check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform
        run: |
          curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/1.14.3/terraform_1.14.3_linux_amd64.zip"
          sudo unzip -o terraform.zip -d /usr/local/bin
      - name: Validate
        run: |
          terraform fmt -check -recursive
          for stack in terraform/cluster terraform/tenant terraform/tenant/isolated; do
            terraform -chdir="${stack}" init -backend=false -input=false
            terraform -chdir="${stack}" validate
          done

  cluster:
    # The kind stand is a manual run. A push still checks the contract.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Demo
        run: DEMO_DOWN=1 bash scripts/demo
