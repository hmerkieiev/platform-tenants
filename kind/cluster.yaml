# The pod network matches the Calico manifest's default pool so the CNI
# starts without a second address plan. It is not an account CIDR.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-tenants
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 8000
        hostPort: 8090
        protocol: TCP
