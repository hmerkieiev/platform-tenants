apiVersion: v1
kind: Service
metadata:
  name: internal
  namespace: {{ include "tenant.ns" . }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Values.name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ include "tenant.ns" . }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The pod hostname is fixed. Two pods cannot share it during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Values.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Values.name }}
    spec:
      # redis-sessions.internal.<namespace> resolves through this hostname
      # plus the headless Service above. There is no password: the network
      # policy is the wall, and a password would hide a hole in it.
      hostname: redis-sessions
      subdomain: internal
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
