apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant
  namespace: {{ include "tenant.ns" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.cpu | quote }}
    requests.memory: {{ .Values.quota.memory | quote }}
